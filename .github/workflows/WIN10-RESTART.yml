name: Win-10 Server Dev_Abdo
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Dev" dir=in action=allow protocol=TCP localport=3389 2>$null
          Restart-Service TermService -Force
      - name: Create User Dev
        run: |
          $u="Dev"; $p="Abdo012#"; $e=Get-LocalUser -Name $u -ErrorAction SilentlyContinue
          if(-not $e){$s=ConvertTo-SecureString $p -AsPlainText -Force; New-LocalUser -Name $u -Password $s -AccountNeverExpires -PasswordNeverExpires; Add-LocalGroupMember -Group Administrators -Member $u -ErrorAction SilentlyContinue; Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue}
          $LASTEXITCODE=0
      - name: Restore Profile To Temp
        uses: actions/cache/restore@v4
        with:
          path: C:\Users\DevBackup
          key: rdp-profile-v5
          restore-keys: rdp-profile-
      - name: Copy Settings To New Profile
        run: |
          if(Test-Path C:\Users\DevBackup\Documents){
            Write-Host "Cache found - restoring..."
            robocopy C:\Users\DevBackup\Documents C:\Users\Dev\Documents /E /R:0 /W:0 2>$null | Out-Null
            robocopy C:\Users\DevBackup\Desktop C:\Users\Dev\Desktop /E /R:0 /W:0 2>$null | Out-Null
            robocopy C:\Users\DevBackup\Pictures C:\Users\Dev\Pictures /E /R:0 /W:0 2>$null | Out-Null
            robocopy "C:\Users\DevBackup\AppData\Roaming\Microsoft\Windows\Themes" "C:\Users\Dev\AppData\Roaming\Microsoft\Windows\Themes" /E /R:0 /W:0 2>$null | Out-Null
            if(Test-Path C:\Users\DevBackup\wallpaper.reg){ Copy-Item C:\Users\DevBackup\wallpaper.reg C:\Users\Dev\ -Force; reg import C:\Users\Dev\wallpaper.reg 2>$null }
            if(Test-Path C:\Users\DevBackup\theme.reg){ Copy-Item C:\Users\DevBackup\theme.reg C:\Users\Dev\ -Force; reg import C:\Users\Dev\theme.reg 2>$null }
            Write-Host "Restored wallpaper/theme"
          } else { Write-Host "No cache yet - first run" }
          dir C:\Users\ | Out-String | Write-Host
          $LASTEXITCODE=0
      - name: Install Tailscale
        run: |
          $tp="$env:ProgramFiles\Tailscale\tailscale.exe"; if(-not(Test-Path $tp)){Invoke-WebRequest -Uri https://pkgs.tailscale.com/stable/tailscale-setup-1.102.4-amd64.msi -OutFile $env:TEMP\t.msi; Start-Process msiexec.exe -ArgumentList "/i","`"$env:TEMP\t.msi`"","/quiet" -Wait}
      - name: Connect Tailscale Fixed
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $kf="$env:TEMP\tskey.txt"; $env:TS_KEY | Out-File $kf -Encoding ascii -NoNewline; & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=file:$kf --hostname=gh-win-fixed; Remove-Item $kf -Force
          $ip=& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4; echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
      - name: Send Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $ip=$env:TAILSCALE_IP; $k=@{inline_keyboard=@(@(@{text="📋 نسخ IP";copy_text=@{text="$ip"}}),@(@{text="👤 نسخ اليوزر";copy_text=@{text="Dev"}}),@(@{text="🔑 نسخ الباسورد";copy_text=@{text="Abdo012#"}}))}; $p=@{chat_id=$env:CHAT_ID; text="✅ RDP جاهز`nIP: $ip`nHost: gh-win-fixed"; reply_markup=$k}|ConvertTo-Json -Depth 5 -Compress; Invoke-RestMethod -Uri "https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage" -Method Post -ContentType "application/json" -Body $p | Out-Null
      - name: Keep Alive
        run: Start-Sleep -Seconds 21000
      - name: Backup Profile Before Save
        if: always()
        run: |
          New-Item -Path C:\Users\DevBackup -ItemType Directory -Force | Out-Null
          robocopy C:\Users\Dev\Documents C:\Users\DevBackup\Documents /E /R:0 /W:0 2>$null | Out-Null
          robocopy C:\Users\Dev\Desktop C:\Users\DevBackup\Desktop /E /R:0 /W:0 2>$null | Out-Null
          robocopy C:\Users\Dev\Pictures C:\Users\DevBackup\Pictures /E /R:0 /W:0 2>$null | Out-Null
          robocopy "C:\Users\Dev\AppData\Roaming\Microsoft\Windows\Themes" "C:\Users\DevBackup\AppData\Roaming\Microsoft\Windows\Themes" /E /R:0 /W:0 2>$null | Out-Null
          try{
            $p=ConvertTo-SecureString "Abdo012#" -AsPlainText -Force; $c=New-Object PSCredential("Dev",$p); Enable-PSRemoting -Force 2>$null
            Invoke-Command -ComputerName localhost -Credential $c -ScriptBlock { reg export "HKCU\Control Panel\Desktop" "C:\Users\DevBackup\wallpaper.reg" /y 2>$null; reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes" "C:\Users\DevBackup\theme.reg" /y 2>$null } -ErrorAction SilentlyContinue
          } catch {}
          $LASTEXITCODE=0
      - name: Trigger Next Run
        if: always()
        run: gh workflow run WIN10-RESTART.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save Profile
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\Users\DevBackup
          key: rdp-profile-v5-${{ github.run_id }}
