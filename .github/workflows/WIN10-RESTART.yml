name: Win-10 Server 2022 RDP - Dev_Abdo
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Dev" dir=in action=allow protocol=TCP localport=3389 2>$null
          Restart-Service TermService -Force
      - name: Create User Dev Keep Profile
        run: |
          $u="Dev"; $p="Abdo012#"
          $e=Get-LocalUser -Name $u -ErrorAction SilentlyContinue
          if(-not $e){
            $s=ConvertTo-SecureString $p -AsPlainText -Force; New-LocalUser -Name $u -Password $s -AccountNeverExpires -PasswordNeverExpires
            Add-LocalGroupMember -Group Administrators -Member $u -ErrorAction SilentlyContinue
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue
          } else {
            $s=ConvertTo-SecureString $p -AsPlainText -Force; Set-LocalUser -Name $u -Password $s -ErrorAction SilentlyContinue
          }
          $LASTEXITCODE=0
      - name: Restore Full Profile After User Created
        uses: actions/cache/restore@v4
        with:
          path: C:\Users\Dev
          key: rdp-full-v3
          restore-keys: rdp-full-
      - name: Apply Wallpaper Registry
        run: |
          if(Test-Path C:\Users\Dev\wallpaper.reg){ reg import C:\Users\Dev\wallpaper.reg 2>$null; Write-Host "Wallpaper registry restored" }
          if(Test-Path C:\Users\Dev\theme.reg){ reg import C:\Users\Dev\theme.reg 2>$null; Write-Host "Theme restored" }
          $LASTEXITCODE=0
      - name: Install Tailscale
        run: |
          $tp="$env:ProgramFiles\Tailscale\tailscale.exe"
          if(-not(Test-Path $tp)){
            $u="https://pkgs.tailscale.com/stable/tailscale-setup-1.102.4-amd64.msi"; $i="$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $u -OutFile $i; Start-Process msiexec.exe -ArgumentList "/i","`"$i`"","/quiet","/norestart" -Wait; Remove-Item $i -Force
          }
      - name: Connect Tailscale Fixed
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $kf="$env:TEMP\tskey.txt"; $env:TS_KEY | Out-File -FilePath $kf -Encoding ascii -NoNewline
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=file:$kf --hostname=gh-win-fixed
          Remove-Item $kf -Force
          $ip=$null; $r=0; while(-not $ip -and $r -lt 15){$ip=& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4; Start-Sleep 5; $r++}
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV; Write-Host "IP: $ip"
      - name: Send Telegram With Copy Buttons
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          $ip = $env:TAILSCALE_IP
          $keyboard = @{
            inline_keyboard = @(
              @(@{ text="📋 نسخ IP"; copy_text=@{ text="$ip" } }),
              @(@{ text="👤 نسخ اليوزر"; copy_text=@{ text="Dev" } }),
              @(@{ text="🔑 نسخ الباسورد"; copy_text=@{ text="Abdo012#" } })
            )
          }
          $payload = @{ chat_id=$env:CHAT_ID; text="✅ RDP جاهز`nIP: $ip`nHost: gh-win-fixed`nUser: Dev`nPass: Abdo012#"; reply_markup=$keyboard } | ConvertTo-Json -Depth 5 -Compress
          Invoke-RestMethod -Uri "https://api.telegram.org/bot$env:BOT_TOKEN/sendMessage" -Method Post -ContentType "application/json" -Body $payload | Out-Null
      - name: Keep Alive
        run: Start-Sleep -Seconds 21000
      - name: Export Theme Before Save
        if: always()
        run: |
          reg export "HKCU\Control Panel\Desktop" C:\Users\Dev\wallpaper.reg /y 2>$null
          reg export "HKCU\Software\Microsoft\Windows\CurrentVersion\Themes" C:\Users\Dev\theme.reg /y 2>$null
          $LASTEXITCODE=0
      - name: Trigger Next Run
        if: always()
        run: gh workflow run WIN10-RESTART.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save Full Profile
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\Users\Dev
          key: rdp-full-v3-${{ github.run_id }}
