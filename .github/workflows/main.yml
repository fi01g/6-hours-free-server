name: Windows Server 2022 RDP - Dev_Abdo

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Dev" 2>$null
          netsh advfirewall firewall add rule name="RDP-Dev" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create User Dev_Abdo
        run: |
          $username = "Dev_Abdo"
          $password = "Abdo012#"
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($existing) { Remove-LocalUser -Name $username -ErrorAction SilentlyContinue }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          echo "RDP_CREDS=User: $username | Password: $password" >> $env:GITHUB_ENV

      - name: Hide Other Users
        run: |
          $path = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList"
          if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
          Set-ItemProperty -Path $path -Name "Administrator" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $path -Name "Guest" -Value 0 -Type DWord -Force

      - name: Install Tailscale
        run: |
          $tsPath = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsPath)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $installer = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $url -OutFile $installer
            Start-Process msiexec.exe -ArgumentList "/i", "`"$installer`"", "/quiet", "/norestart" -Wait
            Remove-Item $installer -Force
          }

      - name: Connect Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=Dev-Abdo-RDP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            Start-Sleep -Seconds 5
            $retries++
          }
          if (-not $tsIP) { Write-Error "No IP"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Show Info
        run: |
          Write-Host "================================================"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: Dev_Abdo"
          Write-Host "Password: Abdo012#"
          Write-Host "================================================"

      - name: Keep Alive
        run: |
          Write-Host "Server running 6 hours max..."
          Start-Sleep -Seconds 21400
          # Make sure password never expires
          Set-LocalUser -Name $targetName -PasswordNeverExpires:$true
          Set-LocalUser -Name $targetName -AccountNeverExpires:$true

          Add-LocalGroupMember -Group "Administrators" -Member $targetName -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $targetName -ErrorAction SilentlyContinue

          $user = Get-LocalUser -Name $targetName
          if ($user) {
            Write-Host "==> User $targetName is ready with full admin rights!"
            Write-Host "    Enabled: $($user.Enabled)"
            Write-Host "    PasswordNeverExpires: $($user.PasswordNeverExpires)"
          } else {
            Write-Error "Failed to rename user!"
            exit 1
          }

          echo "RDP_CREDS=User: $targetName | Password: $password" >> $env:GITHUB_ENV

      - name: Hide Other Users
        run: |
          $path = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList"
          if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }

          Set-ItemProperty -Path $path -Name "Administrator" -Value 0 -Type DWord -Force
          Disable-LocalUser -Name "Administrator" -ErrorAction SilentlyContinue

          Set-ItemProperty -Path $path -Name "Guest" -Value 0 -Type DWord -Force

          Set-ItemProperty -Path $path -Name "DefaultAccount" -Value 0 -Type DWord -Force

          Write-Host "==> All other users hidden. Only Dev_Abdo is visible."

      - name: Ensure Microsoft Store
        run: |
          $store = Get-ChildItem "C:\Program Files\WindowsApps" -Filter "*WindowsStore*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($store) {
            Write-Host "==> Microsoft Store is installed!"
          } else {
            Start-Service -Name "AppXSvc" -ErrorAction SilentlyContinue
            Set-Service -Name "AppXSvc" -StartupType Automatic -ErrorAction SilentlyContinue
            Start-Service -Name "ClipSvc" -ErrorAction SilentlyContinue
            Set-Service -Name "ClipSvc" -StartupType Automatic -ErrorAction SilentlyContinue
            Write-Host "==> AppX services enabled."
          }

      - name: Install Tailscale
        run: |
          $tsPath = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tsPath)) {
            $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
            $installer = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $url -OutFile $installer
            Start-Process msiexec.exe -ArgumentList "/i",$installer,"/quiet","/norestart" -Wait
            Remove-Item $installer -Force
          }

      - name: Connect Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=Dev-Abdo-RDP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
            $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
            Start-Sleep -Seconds 5
            $retries++
          }
          if (-not $tsIP) { Write-Error "No IP"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Show Info
        run: |
          Write-Host "================================================"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: Dev_Abdo"
          Write-Host "Password: Abdo012#"
          Write-Host "================================================"

      - name: Keep Alive
        run: |
          Write-Host "Server running 6 hours max..."
          Start-Sleep -Seconds 21400

      - name: Hide Other Users
        run: |
          $path = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList"
          if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
          Set-ItemProperty -Path $path -Name "Administrator" -Value 0 -Type DWord -Force
          Disable-LocalUser -Name "Administrator" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $path -Name "Guest" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $path -Name "DefaultAccount" -Value 0 -Type DWord -Force

      - name: Force Install Microsoft Store (Server Fix - Non-Blocking)
        continue-on-error: true
        run: |
          $found = Get-ChildItem "C:\Program Files\WindowsApps" -Filter "*WindowsStore*" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) { Write-Host "==> Store already installed: $($found.Name)"; exit 0 }
          Write-Host "==> Installing Store with 180s timeout..."
          Set-Service -Name "AppXSvc" -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service -Name "AppXSvc" -ErrorAction SilentlyContinue
          Set-Service -Name "ClipSvc" -StartupType Automatic -ErrorAction SilentlyContinue; Start-Service -Name "ClipSvc" -ErrorAction SilentlyContinue
          $zip = "$env:TEMP\LTSC-Store.zip"; $dest = "$env:TEMP\LTSC-Store"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path $zip) { Remove-Item $zip -Force -ErrorAction SilentlyContinue }
          Invoke-WebRequest -Uri "https://github.com/kkkgo/LTSC-Add-MicrosoftStore/archive/master.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $addStorePath = Get-ChildItem -Path $dest -Directory | Select-Object -First 1
          $cmd = Join-Path $addStorePath.FullName "Add-Store.cmd"
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$cmd`"" -PassThru -WindowStyle Hidden
          $exited = $p.WaitForExit(180000)
          if (-not $exited) { try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {} }

      - name: Install Tailscale (EXE - Bypass MSI 1719)
        run: |
          Write-Host "==> Installing Tailscale via EXE (bypass Windows Installer)..."
          $candidates = @("$env:ProgramFiles\Tailscale\tailscale.exe","${env:ProgramFiles(x86)}\Tailscale\tailscale.exe")
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($found) { Write-Host "==> Already installed at $found"; exit 0 }

          # استخدم الـ EXE مش الـ MSI عشان نتخطى ايرور 1719 نهائي
          $exeUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.102.4.exe"
          $exePath = "$env:TEMP\tailscale-setup.exe"
          Write-Host "==> Downloading $exeUrl"
          Invoke-WebRequest -Uri $exeUrl -OutFile $exePath
          
          Write-Host "==> Installing silently /S..."
          $proc = Start-Process -FilePath $exePath -ArgumentList "/S" -Wait -PassThru
          Write-Host "==> EXE Exit Code: $($proc.ExitCode)"
          Remove-Item $exePath -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 15

          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            $search = Get-ChildItem "C:\Program Files*\" -Filter "tailscale.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($search) { $found = $search.FullName }
          }
          
          if ($found) { 
            Write-Host "==> SUCCESS: Tailscale at $found"
            & $found version
          } else {
            Write-Host "==> EXE failed, trying 7-Zip extract from MSI as last fallback..."
            $msiUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.102.4-amd64.msi"
            $msiPath = "$env:TEMP\ts.msi"
            Invoke-WebRequest -Uri $msiUrl -OutFile $msiPath
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
            if (Test-Path $sevenZip) {
              & $sevenZip x "$msiPath" -o"$env:TEMP\ts_extract" -y | Out-Host
              $exe = Get-ChildItem "$env:TEMP\ts_extract" -Filter "tailscale.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($exe) {
                New-Item -ItemType Directory -Path "$env:ProgramFiles\Tailscale" -Force | Out-Null
                Copy-Item $exe.FullName "$env:ProgramFiles\Tailscale\tailscale.exe" -Force
                $found = "$env:ProgramFiles\Tailscale\tailscale.exe"
                Write-Host "==> Extracted via 7-Zip to $found"
              }
            }
            if (-not $found -or -not (Test-Path $found)) { Write-Error "All methods failed"; exit 1 }
          }

      - name: Connect Tailscale (Auto-Find Exe)
        run: |
          $tsExe = @("$env:ProgramFiles\Tailscale\tailscale.exe","${env:ProgramFiles(x86)}\Tailscale\tailscale.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $tsExe) { $search = Get-ChildItem "C:\Program Files*\" -Filter "tailscale.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1; if ($search) { $tsExe = $search.FullName } }
          if (-not $tsExe) { Write-Error "tailscale.exe not found"; exit 1 }
          Write-Host "==> Using: $tsExe"
          $authKey = "${{ secrets.TAILSCALE_AUTH_KEY }}"
          if (-not $authKey) { Write-Error "TAILSCALE_AUTH_KEY EMPTY! ضيفه في Secrets"; exit 1 }
          & $tsExe up --authkey=$authKey --hostname=Dev-Abdo-RDP --accept-routes --accept-dns=false
          $tsIP = $null; $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
            $tsIP = & $tsExe ip -4 2>$null; if ($tsIP) { $tsIP = $tsIP.Trim() }
            if (-not $tsIP) { Start-Sleep -Seconds 5; $retries++ }
          }
          if (-not $tsIP) { & $tsExe status; Write-Error "No IP"; exit 1 }
          Write-Host "==> Tailscale IP: $tsIP"
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Show Info
        run: |
          Write-Host "================================================"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: Dev_Abdo"
          Write-Host "Password: Abdo012#"
          Write-Host "================================================"

      - name: Keep Alive
        run: |
          Write-Host "Server running 6 hours max..."
          Start-Sleep -Seconds 21400
