      - name: Keep Alive
        run: |
          Write-Host "Server running 6 hours max..."
          Start-Sleep -Seconds 21400
          
          New-LocalUser -Name "DEV" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "DEV"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "DEV"
          
          echo "RDP_CREDS=User: ABDO | Password: $password" >> $env:GITHUB_ENV
          
