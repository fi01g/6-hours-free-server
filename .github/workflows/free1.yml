name: Win-10 Server 2022 RDP - Dev_Abdo
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Restore Cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Users\Dev\Documents
          key: win-rdp-v1
          restore-keys: win-rdp-

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Dev" 2>$null
          netsh advfirewall firewall add rule name="RDP-Dev" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create User Dev
        run: |
          $u="Dev"; $p="Abdo012#"
          $e=Get-LocalUser -Name $u -ErrorAction SilentlyContinue; if($e){Remove-LocalUser -Name $u -ErrorAction SilentlyContinue}
          $s=ConvertTo-SecureString $p -AsPlainText -Force; New-LocalUser -Name $u -Password $s -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $u -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $u -ErrorAction SilentlyContinue

      - name: Install Tailscale
        run: |
          $tp="$env:ProgramFiles\Tailscale\tailscale.exe"
          if(-not(Test-Path $tp)){
            $u="https://pkgs.tailscale.com/stable/tailscale-setup-1.102.4-amd64.msi"; $i="$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $u -OutFile $i; Start-Process msiexec.exe -ArgumentList "/i","`"$i`"","/quiet","/norestart" -Wait; Remove-Item $i -Force
          }

      - name: Connect Tailscale Fixed
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $kf="$env:TEMP\tskey.txt"; $env:TS_KEY | Out-File -FilePath $kf -Encoding ascii -NoNewline
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=file:$kf --hostname=gh-win-fixed
          Remove-Item $kf -Force
          $ip=$null; $r=0; while(-not $ip -and $r -lt 15){$ip=& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4; Start-Sleep 5; $r++}
          echo "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV; Write-Host "IP: $ip Host: gh-win-fixed"

      - name: Show Info
        run: |
          Write-Host "IP: $env:TAILSCALE_IP Host: gh-win-fixed User: Dev Pass: Abdo012#"

      - name: Keep Alive
        run: Start-Sleep -Seconds 21000

      - name: Trigger Next Run
        if: always()
        run: gh workflow run free1.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\Users\Dev\Documents
          key: win-rdp-v1-${{ github.run_id }}
