name: Win-10 Server 2022 RDP - Dev_Abdo
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  workflow_run:
    workflows: ["Win-10 Server 2022 RDP - Dev_Abdo"]
    types: [completed]

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Restore Cache
        uses: actions/cache/restore@v4
        with:
          path: C:\Users\Dev\Documents
          key: win-rdp-v1
          restore-keys: win-rdp-

      - name: Enable RDP and Configure Firewall
        run: |
          Write-Host "==> Enabling RDP..."
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Dev" 2>$null
          netsh advfirewall firewall add rule name="RDP-Dev" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "==> RDP enabled."

      - name: Create User Dev
        run: |
          $username = "Dev"
          $password = "Abdo012#"
          Write-Host "==> Creating user $username..."
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if ($existing) { Remove-LocalUser -Name $username -ErrorAction SilentlyContinue }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires -PasswordNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          Write-Host "==> User $username created."
          echo "RDP_CREDS=User: $username | Password: $password" >> $env:GITHUB_ENV

      - name: Hide Other Users
        run: |
          $p = "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList"
          if (-not (Test-Path $p)) { New-Item -Path $p -Force | Out-Null }
          Set-ItemProperty -Path $p -Name "Administrator" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $p -Name "Guest" -Value 0 -Type DWord -Force

      - name: Install Tailscale
        run: |
          $tailscalePath = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscalePath)) {
            Write-Host "==> Installing Tailscale..."
            $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.102.4-amd64.msi"
            $installerPath = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
            Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
            Remove-Item $installerPath -Force
          }

      - name: Connect to Tailscale Fixed Hostname
        env:
          TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          Write-Host "==> Connecting..."
          $keyFile = "$env:TEMP\tskey.txt"
          $env:TS_KEY | Out-File -FilePath $keyFile -Encoding ascii -NoNewline
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=file:$keyFile --hostname=gh-win-fixed
          Remove-Item $keyFile -Force
          $tsIP = $null; $retries=0
          while (-not $tsIP -and $retries -lt 15) { $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4; Start-Sleep -Seconds 5; $retries++ }
          if (-not $tsIP) { Write-Error "Tailscale IP not assigned"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "==> Tailscale IP: $tsIP Host: gh-win-fixed"

      - name: Verify RDP
        run: |
          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if ($test.TcpTestSucceeded) { Write-Host "==> RDP OPEN!" } else { Write-Error "RDP failed"; exit 1 }

      - name: Show Connection Info
        run: |
          Write-Host "================================================"
          Write-Host "  Tailscale IP:  $env:TAILSCALE_IP"
          Write-Host "  Host: gh-win-fixed"
          Write-Host "  Username: Dev"
          Write-Host "  Password: Abdo012#"
          Write-Host "================================================"

      - name: Keep Alive 5h50m
        run: |
          Write-Host "Server running..."
          Start-Sleep -Seconds 21000

      - name: Trigger Next Run
        if: always()
        run: gh workflow run "Win-10 Server 2022 RDP - Dev_Abdo"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: C:\Users\Dev\Documents
          key: win-rdp-v1-${{ github.run_id }}
